<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#2D0B40" />
  <meta name="description" content="CalculadoraTattoo: PWA para gestão de estoque e orçamento de estúdios de tatuagem." />
  
  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CalculadoraTattoo" />
  <meta name="application-name" content="CalculadoraTattoo" />
  <meta name="msapplication-TileColor" content="#2D0B40" />
  <meta name="msapplication-config" content="browserconfig.xml" />
  
  <!-- Security & Performance -->
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  
  <!-- Theme Script (prevent FOUC) -->
  <script>
    (() => {
      const THEME_STORAGE_KEY = "CALCULADORA_TATTOO_THEME";
      try {
        const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        const prefersLight = window.matchMedia && 
                            window.matchMedia("(prefers-color-scheme: light)").matches;
        const themeName = ["light", "dark"].includes(storedTheme) 
                         ? storedTheme 
                         : (prefersLight ? "light" : "dark");
        document.documentElement.dataset.theme = themeName;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  
  <title>CalculadoraTattoo</title>
</head>
<body>
  <!-- Loading Indicator -->
  <div class="app-loading" id="appLoading" aria-hidden="true">
    <div class="spinner"></div>
    <p>Carregando CalculadoraTattoo...</p>
  </div>

  <!-- Drawer Backdrop -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <!-- Main Shell -->
  <div class="app-shell" id="appShell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral principal">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">CT</div>
        <div>
          <strong>CalculadoraTattoo</strong>
          <span>Gestão premium para estúdios</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Navegação principal" role="navigation">
        <button class="nav-link is-active" type="button" data-screen="home" aria-label="Ir para tela inicial">
          <span aria-hidden="true"><i data-lucide="home"></i></span>
          <span>Início</span>
        </button>
        <button class="nav-link" type="button" data-screen="reports" aria-label="Ver relatórios">
          <span aria-hidden="true"><i data-lucide="bar-chart-3"></i></span>
          <span>Relatórios</span>
        </button>
        <button class="nav-link" type="button" data-screen="inventory" aria-label="Gerenciar estoque">
          <span aria-hidden="true"><i data-lucide="box"></i></span>
          <span>Estoque</span>
        </button>
        <button class="nav-link" type="button" data-screen="budget" aria-label="Criar orçamento">
          <span aria-hidden="true"><i data-lucide="receipt"></i></span>
          <span>Orçamento</span>
        </button>
      </nav>

      <section class="sidebar-tools" aria-label="Ferramentas de gerenciamento de dados">
        <span class="tools-header">Dados</span>
        <button class="sidebar-tool-button" id="exportDataButton" type="button" title="Exportar dados como JSON">
          <i data-lucide="download" aria-hidden="true"></i>
          <span>Exportar</span>
        </button>
        <button class="sidebar-tool-button" id="importDataButton" type="button" title="Importar dados de um arquivo JSON">
          <i data-lucide="upload" aria-hidden="true"></i>
          <span>Importar</span>
        </button>
        <button class="sidebar-tool-button is-danger" id="resetDataButton" type="button" title="Restaurar dados padrão">
          <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          <span>Restaurar</span>
        </button>
        <input id="fileImportInput" type="file" accept="application/json,.json" hidden aria-hidden="true" />
        <div class="sidebar-status" id="dataStatus" aria-live="polite" aria-atomic="true"></div>
      </section>

      <section class="sidebar-footer">
        <span>📱 Armazenamento Local</span>
        <small>Todos os dados são salvos no seu navegador</small>
      </section>
    </aside>

    <!-- App Header -->
    <header class="topbar" role="banner">
      <button class="icon-button mobile-menu-button" id="openSidebarButton" type="button" aria-label="Abrir menu lateral">
        <i data-lucide="menu" aria-hidden="true"></i>
      </button>
      <div class="topbar-title">
        <span class="eyebrow" id="pageEyebrow">Visão geral</span>
        <h1 id="pageTitle">Início</h1>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle-button" id="themeToggleButton" type="button" aria-label="Alternar tema" aria-pressed="false">
          <i data-lucide="moon" aria-hidden="true"></i>
          <span id="themeToggleLabel">Escuro</span>
        </button>
        <button class="primary-button compact-only" id="quickAddItemButton" type="button" aria-label="Adicionar novo item rapidamente">
          <i data-lucide="plus" aria-hidden="true"></i>
          <span>Novo</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content-shell" id="contentShell" role="main">
      <!-- Screens Container -->
      <div id="screensContainer"></div>
    </main>
  </div>

  <!-- Modals Container -->
  <div id="modalsContainer"></div>

  <!-- Hidden Elements -->
  <div id="hiddenContainer" hidden></div>

  <!-- External Libraries (async load) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>

  <!-- Firebase Config (optional - only if using cloud sync) -->
  <script src="config/firebase.config.js" defer></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && 'caches' in window) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(registration => {
            console.log('SW registered:', registration.scope);
            // Check for updates periodically
            setInterval(() => {
              registration.update();
            }, 60000); // Check every minute
          })
          .catch(error => {
            console.warn('SW registration failed:', error);
          });
      });
    }
  </script>

  <!-- App Initialization -->
  <script type="module" src="js/main.js"></script>
  
  <noscript>
    <div class="noscript-warning">
      <strong>JavaScript desabilitado</strong>
      <p>A CalculadoraTattoo requer JavaScript habilitado para funcionar. Por favor, ative-o em suas configurações do navegador.</p>
    </div>
  </noscript>
</body>
</html>
