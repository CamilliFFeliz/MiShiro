<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#210B46" />
  <title>CalculadoraTattoo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <div class="brand-row" aria-label="CalculadoraTattoo">
        <div class="brand-mark">CT</div>
        <div class="brand-copy">
          <strong>CalculadoraTattoo</strong>
          <span>Estoque e ficha</span>
        </div>
      </div>

      <section class="total-card" aria-live="polite">
        <span>Total da ficha</span>
        <strong id="headerBudgetTotal">R$ 0,00</strong>
      </section>
    </header>

    <main class="app-content">
      <section class="app-screen" id="inventoryScreen" data-screen-panel="inventory">
        <div class="screen-heading">
          <div>
            <span class="section-label">Estoque</span>
            <h1>Insumos</h1>
          </div>
          <button class="button button-secondary" id="resetApplicationButton" type="button">Restaurar</button>
        </div>

        <form class="surface-card stacked-form" id="supplyForm" autocomplete="off">
          <label class="field-group">
            <span>Material</span>
            <input id="supplyNameInput" name="supplyName" type="text" placeholder="Agulha, batoque, tinta..." required />
          </label>

          <div class="form-grid">
            <label class="field-group">
              <span>Qtd. embalagem</span>
              <input id="packageQuantityInput" name="packageQuantity" type="text" inputmode="decimal" placeholder="50" required />
            </label>

            <label class="field-group">
              <span>Unidade</span>
              <input id="unitLabelInput" name="unitLabel" type="text" placeholder="un, ml, folhas" required />
            </label>

            <label class="field-group form-grid-wide">
              <span>Preco pago</span>
              <input id="packagePriceInput" name="packagePrice" type="text" inputmode="decimal" placeholder="30,00" required />
            </label>
          </div>

          <button class="button button-primary" type="submit">Salvar insumo</button>
        </form>

        <div class="metric-grid" id="inventoryMetricGrid"></div>

        <label class="search-field">
          <span class="visually-hidden">Buscar insumo</span>
          <input id="inventorySearchInput" type="search" placeholder="Buscar insumo" />
        </label>

        <div class="card-list" id="supplyList"></div>
      </section>

      <section class="app-screen" id="budgetScreen" data-screen-panel="budget">
        <div class="screen-heading">
          <div>
            <span class="section-label">Ficha</span>
            <h1>Orcamento</h1>
          </div>
          <button class="button button-secondary" id="clearBudgetButton" type="button">Limpar</button>
        </div>

        <form class="surface-card stacked-form" id="budgetForm" autocomplete="off">
          <label class="field-group">
            <span>Sessao</span>
            <input id="sessionNameInput" name="sessionName" type="text" placeholder="Flash pequeno no antebraco" />
          </label>

          <label class="field-group">
            <span>Cliente</span>
            <input id="clientNameInput" name="clientName" type="text" placeholder="Nome do cliente" />
          </label>

          <label class="field-group">
            <span>Observacoes</span>
            <textarea id="sessionNotesInput" name="sessionNotes" rows="3" placeholder="Tamanho, regiao e detalhes"></textarea>
          </label>
        </form>

        <section class="result-panel" aria-live="polite">
          <span>Custo total gasto</span>
          <strong id="budgetTotalValue">R$ 0,00</strong>
          <small id="budgetTotalDetail">0 insumos selecionados</small>
        </section>

        <div class="metric-grid" id="budgetMetricGrid"></div>

        <label class="search-field">
          <span class="visually-hidden">Buscar item da ficha</span>
          <input id="budgetSearchInput" type="search" placeholder="Buscar item da ficha" />
        </label>

        <div class="card-list" id="budgetItemList"></div>
      </section>
    </main>

    <nav class="bottom-navigation" aria-label="Navegacao principal">
      <button class="navigation-button" type="button" data-screen-target="inventory">
        <span>Estoque</span>
      </button>
      <button class="navigation-button" type="button" data-screen-target="budget">
        <span>Ficha</span>
      </button>
    </nav>
  </div>

  <template id="emptyStateTemplate">
    <article class="empty-state">
      <strong>Nenhum item encontrado</strong>
      <span>Ajuste a busca ou cadastre um novo insumo.</span>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
