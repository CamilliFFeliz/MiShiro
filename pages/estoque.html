<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#360a75" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/estoque.css" />
  <title>MiShiro Tattoo • Estoque</title>
</head>
<body data-page="estoque">
  <div id="app" class="app-frame">
    <main id="appMain" class="page-shell">
      <header class="page-header">
        <span class="eyebrow">Estoque</span>
        <h1>Insumos do estúdio</h1>
        <p>Cadastro por categoria, com cálculo real por caixa, unidade, frasco, embalagem, pacote ou rolo.</p>
      </header>
      <section class="stock-grid">
        <form id="formEstoque" class="panel-card stock-form" autocomplete="off">
          <header class="section-title"><span>Novo item</span><h2>Cadastro inteligente</h2></header>
          <section class="category-choice-grid" id="categoryChoiceGrid" aria-label="Categorias de estoque"></section>
          <div class="stock-helper" id="categoryHelper"></div>
          <div class="dynamic-fields-grid" id="dynamicFieldsGrid"></div>
          <section class="unit-cost-preview" id="unitCostPreview" aria-live="polite">
            <span>Prévia do cálculo</span>
            <strong>R$ 0,00</strong>
            <small>Preencha os campos para calcular o custo de uso.</small>
          </section>
          <button class="button button-primary" type="submit">Salvar item</button>
          <p id="statusEstoque" class="form-status" aria-live="polite"></p>
        </form>
        <section class="panel-card stock-list-panel">
          <header class="section-title"><span>Lista</span><h2>Itens cadastrados</h2></header>
          <div class="toolbar-inline"><label class="field"><span>Buscar</span><input id="buscaEstoque" type="search" placeholder="Nome, categoria, marca, cor ou numeração" /></label></div>
          <section class="chip-row compact-chip-row" id="filtrosEstoque" aria-label="Filtros de categoria"></section>
          <div id="alertasEstoque" class="alert-list"></div>
          <div id="listaEstoque" class="stock-list"></div>
        </section>
      </section>
    </main>
  </div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="../src/pages/estoque.js"></script>
</body>
</html>
