<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#360a75" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/estoque.css" />
  <title>MiShiro Tattoo • Estoque</title>
</head>
<body data-page="estoque">
  <div id="app" class="app-frame">
    <main id="appMain" class="page-shell">
      <header class="page-header inventory-page-header">
        <div>
          <span class="eyebrow">Banco local de insumos</span>
          <h1>Estoque</h1>
          <p>Cadastro e consulta de materiais. Alertas e análise de falta ficam em Relatórios.</p>
        </div>
        <div class="inventory-header-actions">
          <strong class="counter-pill" id="inventoryCounter">0 itens</strong>
          <button class="button button-primary" id="openItemModalButton" type="button"><i data-lucide="plus"></i>Novo item</button>
        </div>
      </header>
      <section class="panel-card stock-list-panel">
        <div class="toolbar-grid old-toolbar-grid">
          <label class="field"><span>Pesquisar no estoque</span><input id="buscaEstoque" type="search" placeholder="Marca, categoria, numeração, cor ou nome" /></label>
          <button class="button button-secondary" id="clearInventorySearchButton" type="button"><i data-lucide="x"></i>Limpar</button>
        </div>
        <section class="chip-row compact-chip-row" id="filtrosEstoque" aria-label="Filtros de categoria"></section>
        <section id="listaEstoque" class="inventory-grid" aria-label="Itens cadastrados"></section>
        <div class="secondary-actions"><button class="button button-ghost" id="restoreReferenceStockButton" type="button"><i data-lucide="rotate-ccw"></i>Restaurar base de referência</button></div>
      </section>
    </main>
  </div>
  <dialog class="modal-card inventory-modal" id="itemModal">
    <form id="formEstoque" class="stock-form" autocomplete="off" method="dialog">
      <div class="modal-header"><div><span>Novo item</span><h2>Cadastrar insumo</h2></div><button class="icon-button" id="closeItemModalButton" type="button" aria-label="Fechar cadastro"><i data-lucide="x"></i></button></div>
      <section class="form-step-panel"><div class="step-heading"><strong>Etapa 1</strong><span>Escolha a categoria principal</span></div><section class="category-choice-grid" id="categoryChoiceGrid"></section></section>
      <section class="form-step-panel"><div class="step-heading"><strong>Etapa 2</strong><span>Preencha a ficha do item</span></div><div class="stock-helper" id="categoryHelper"></div><div class="dynamic-fields-grid" id="dynamicFieldsGrid"></div></section>
      <section class="unit-cost-preview" id="unitCostPreview"><span>Prévia do cálculo</span><strong>R$ 0,00</strong><small>Preencha os campos para calcular o custo de uso.</small></section>
      <button class="button button-primary full-button" type="submit"><i data-lucide="save"></i>Salvar item</button>
      <p id="statusEstoque" class="form-status" aria-live="polite"></p>
    </form>
  </dialog>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="../src/pages/estoque.js"></script>
</body>
</html>
