<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#360a75"/><link rel="manifest" href="../manifest.webmanifest"/><link rel="icon" href="../icons/icon.svg" type="image/svg+xml"/><link rel="stylesheet" href="../assets/css/base.css"/><link rel="stylesheet" href="../assets/css/tokens.css"/><link rel="stylesheet" href="../assets/css/layout.css"/><link rel="stylesheet" href="../assets/css/components.css"/><link rel="stylesheet" href="../assets/css/configuracoes.css"/><title>MiShiro Tattoo • Configurações</title></head>
<body data-page="configuracoes"><div id="app" class="app-frame"><main id="appMain" class="page-shell"><header class="page-header"><span class="eyebrow">Configurações</span><h1>Preferências do estúdio</h1><p>Guarde dados básicos, tema e opções de uso local.</p></header><form id="formConfiguracoes" class="settings-grid"><section class="panel-card"><header class="section-title"><span>Estúdio</span><h2>Dados principais</h2></header><div class="form-grid compact"><label class="field"><span>Nome do estúdio</span><input id="nomeEstudio" placeholder="MiShiro Tattoo"/></label><label class="field"><span>Artista</span><input id="nomeArtista" placeholder="Nome do tatuador"/></label><label class="field"><span>Contato</span><input id="contatoEstudio" placeholder="WhatsApp / Instagram"/></label><label class="field"><span>Sinal padrão (%)</span><input id="sinalPadrao" inputmode="decimal" placeholder="30"/></label></div></section><section class="panel-card"><header class="section-title"><span>Aparência</span><h2>Tema</h2></header><div class="action-stack"><button class="button button-secondary" id="usarTemaClaro" type="button">Tema claro</button><button class="button button-secondary" id="usarTemaEscuro" type="button">Tema escuro</button><button class="button button-primary" type="submit">Salvar configurações</button></div><p id="statusConfiguracoes" class="form-status"></p></section></form></main></div><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script type="module" src="../src/pages/configuracoes.js"></script></body></html>
