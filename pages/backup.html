<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#360a75" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/backup.css" />
  <title>MiShiro Tattoo • Backup</title>
</head>
<body data-page="backup">
  <div id="app" class="app-frame">
    <main id="appMain" class="page-shell">
      <header class="page-header">
        <span class="eyebrow">Backup</span>
        <h1>Segurança dos dados</h1>
        <p>O IndexedDB é o banco local do navegador. O arquivo JSON serve como cópia manual para guardar ou restaurar dados.</p>
      </header>
      <section class="backup-grid">
        <article class="panel-card">
          <header class="section-title"><span>Banco local</span><h2>IndexedDB</h2></header>
          <p>Os dados ficam no dispositivo atual. Use persistência local e faça backups regulares.</p>
          <button id="persistenciaLocal" class="button button-secondary" type="button">Solicitar persistência local</button>
        </article>
        <article class="panel-card">
          <header class="section-title"><span>Documento JSON</span><h2>Exportar e importar</h2></header>
          <div class="action-stack">
            <button id="exportarJson" class="button button-primary" type="button">Exportar backup completo</button>
            <button id="importarJson" class="button button-secondary" type="button">Importar backup JSON</button>
          </div>
          <input id="arquivoJson" type="file" accept="application/json,.json" hidden />
          <p id="statusBackup" class="form-status" aria-live="polite"></p>
        </article>
      </section>
    </main>
  </div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="../src/pages/backup.js"></script>
</body>
</html>
